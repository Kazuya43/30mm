<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30mm 30分タイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header><h1>30mm</h1></header>

  <!-- タイマー -->
  <section id="view-timer">
    <div id="resume" class="card" hidden>
      <h2>続きから</h2>      <div id="resume-list"></div>
    </div>

    <form id="setup" class="card">
      <label for="task">これからやること</label>
      <input id="task" list="task-list" required maxlength="100" placeholder="例: 企画書の構成を作る" autocomplete="off">
      <datalist id="task-list"></datalist>
      <div id="recent" class="chips" aria-label="前に入力したやること"></div>
      <label for="goal">30分での目標</label>
      <input id="goal" required maxlength="100" placeholder="例: 見出しを5つ決める" autocomplete="off">
      <button type="submit" class="primary">30分スタート</button>
    </form>

    <div id="running" class="card" hidden>
      <div class="clock" id="clock">30:00</div>
      <div id="progress" class="progress" data-style="bar">
        <div class="bar"><div id="bar-fill"></div></div>
        <div class="blocks" id="blocks"></div>
        <div class="track">
          <div class="trail" id="trail"></div>
          <svg class="runner" id="runner" viewBox="0 0 12 12" aria-hidden="true"></svg>
          <svg class="flag" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="1" height="11"/><path d="M3 1h7l-2 2.5 2 2.5H3z"/></svg>
        </div>
      </div>
      <div class="seg" id="style-seg" role="radiogroup" aria-label="進み方の表示">
        <button type="button" data-style="bar">バー</button>
        <button type="button" data-style="blocks">ブロック</button>
        <button type="button" data-style="runner">ランナー</button>
      </div>
      <p class="label">やること</p><p id="r-task" class="big"></p>
      <p class="label">目標</p><p id="r-goal" class="big"></p>
      <button id="abort" class="ghost">中断する</button>
    </div>

    <form id="rating" class="card" hidden>
      <h2 id="rt-title">おつかれさま!</h2>
      <p class="label">やること</p><p id="e-task" class="big"></p>
      <p class="label">目標</p><p id="e-goal" class="big"></p>
      <p class="label">達成度は?</p>
      <div class="stars" id="stars" role="radiogroup" aria-label="達成度">
        <button type="button" data-v="1">1</button>
        <button type="button" data-v="2">2</button>
        <button type="button" data-v="3">3</button>
        <button type="button" data-v="4">4</button>
        <button type="button" data-v="5">5</button>
      </div>
      <p class="hint"><span>1 まったく</span><span>5 完璧</span></p>
      <label for="note">メモ(任意)</label>
      <input id="note" maxlength="200" placeholder="気づき・次にやること" autocomplete="off">
      <button type="submit" class="primary" id="save" disabled>記録する</button>
    </form>
  </section>

  <!-- ログ -->
  <section id="view-log" hidden>
    <div class="daynav">
      <button id="prev" class="sq" aria-label="前の日">‹</button>
      <input type="date" id="day">
      <button id="next" class="sq" aria-label="次の日">›</button>
      <button id="today" class="ghost">今日</button>
    </div>
    <div class="tiles" id="summary"></div>
    <ol id="entries"></ol>
    <p id="empty" class="muted" hidden>この日の記録はありません。</p>
    <div class="tools"><button id="export" class="ghost">JSONで書き出す</button></div>
  </section>

  <!-- グラフ -->
  <section id="view-stats" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="card">
      <h2>日別の集中時間</h2>
      <p class="sub">直近7日・分</p>
      <svg id="chart-min" class="chart" role="img" aria-label="日別の集中時間"></svg>
    </div>
    <div class="card">
      <h2>日別の平均達成度</h2>
      <p class="sub">直近7日・5段階</p>
      <svg id="chart-rate" class="chart" role="img" aria-label="日別の平均達成度"></svg>
    </div>
    <div class="card">
      <h2>ジャンル</h2>
      <p class="sub">同じ「やること」をまとめて集計(全期間・合計分の多い順)</p>
      <div id="genres"></div>
      <p id="genres-empty" class="muted" hidden>まだ記録がありません。</p>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="timer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>タイマー
  </button>
  <button class="tab" data-view="log">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>ログ
  </button>
  <button class="tab" data-view="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>グラフ
  </button>
</nav>

<div id="toast" role="status" hidden><b id="toast-title"></b><span id="toast-body"></span></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script src="app.js"></script>
</body>
</html>
